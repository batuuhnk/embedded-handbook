s, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.0" fill="#9198a1">real stack headroom</text><rect x="504" y="40" width="162" height="56" rx="6" fill="#2a2016" stroke="#e3a15c" stroke-width="1.6"/><text x="585.0" y="64.6" text-anchor="middle" font-family="Public Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3">stack</text><text x="585.0" y="80.1" text-anchor="middle" font-family="Public Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.0" fill="#9198a1">← grows down</text><text x="14" y="112" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#9198a1">0x20000000</text><text x="666" y="112" text-anchor="end" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#9198a1">&#95;estack</text><text x="324" y="112" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#9198a1">end + heap</text><path d="M 324,120 L 324,140" fill="none" stroke="#e0b25a" stroke-width="1.6" marker-end="url(#stk)"/><text x="330" y="154" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" fill="#e0b25a">watchpoint / MPU guard / MSPLIM here</text><text x="14" y="154" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" fill="#9198a1">overflow hits heap → end of .bss first</text><text x="340" y="186" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="12" fill="#c3cdc6">RTOS: each task stack is an array in .bss (static) or heap (PSP)</text><rect x="14" y="200" width="150" height="56" rx="6" fill="#2a2314" stroke="#e0b25a" stroke-width="1.6"/><text x="89.0" y="224.7" text-anchor="middle" font-family="Public Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">neighbour variable</text><text x="89.0" y="239.7"