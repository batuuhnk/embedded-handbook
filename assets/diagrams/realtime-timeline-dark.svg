<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" width="660" height="230" role="img" aria-label="realtime timeline"><defs><marker id="r06a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3cdc6"/></marker></defs><path d="M 20,150 L 640,150" fill="none" stroke="#c3cdc6" stroke-width="1.6" marker-end="url(#r06a)"/><text x="640" y="170" text-anchor="end" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" fill="#9198a1">time</text><path d="M 60,150 L 60,40" fill="none" stroke="#e3a15c" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M 330,150 L 330,40" fill="none" stroke="#e3a15c" stroke-width="1.6" stroke-dasharray="5 4"/><text x="62" y="32" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" fill="#e3a15c">period start</text><text x="330" y="32" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" fill="#e3a15c">next period</text><rect x="85" y="110" width="120" height="30" rx="4" fill="#132824" stroke="#52d9c2" stroke-width="1.6"/><text x="145" y="130" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" fill="#e6edf3">execution (C)</text><rect x="368" y="110" width="178" height="30" rx="4" fill="#132824" stroke="#52d9c2" stroke-width="1.6"/><text x="457" y="130" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" fill="#e6edf3">execution (worst = WCET)</text><path d="M 60,100 L 85,100" fill="none" stroke="#c3cdc6" stroke-width="1.6" marker-end="url(#r06a)"/><text x="72" y="92" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#9198a1">latency</text><path d="M 330,100 L 368,100" fill="none" stroke="#c3cdc6" stroke-width="1.6" marker-end="url(#r06a)"/><text x="349" y="92" text-ancho