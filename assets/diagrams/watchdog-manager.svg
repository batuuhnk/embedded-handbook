<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" height="270" role="img" aria-label="watchdog manager"><defs><marker id="wdm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker></defs><rect x="14" y="16" width="150" height="40" rx="6" fill="#e4f0ec" stroke="#136b5e" stroke-width="1.6"/><text x="89.0" y="40.4" text-anchor="middle" font-family="Public Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328">sensor task A</text><path d="M 164,36 L 250,120" fill="none" stroke="#3d444d" stroke-width="1.6" marker-end="url(#wdm)"/><rect x="14" y="68" width="150" height="40" rx="6" fill="#e4f0ec" stroke="#136b5e" stroke-width="1.6"/><text x="89.0" y="92.4" text-anchor="middle" font-family="Public Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328">sensor task B</text><path d="M 164,88 L 250,120" fill="none" stroke="#3d444d" stroke-width="1.6" marker-end="url(#wdm)"/><rect x="14" y="120" width="150" height="40" rx="6" fill="#e4f0ec" stroke="#136b5e" stroke-width="1.6"/><text x="89.0" y="144.4" text-anchor="middle" font-family="Public Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328">processing task</text><path d="M 164,140 L 250,120" fill="none" stroke="#3d444d" stroke-width="1.6" marker-end="url(#wdm)"/><rect x="14" y="172" width="150" height="40" rx="6" fill="#e4f0ec" stroke="#136b5e" stroke-width="1.6"/><text x="89.0" y="196.4" text-anchor="middle" font-family="Public Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328">comms task</text><path d="M 164,192 L 250,120" fill="none" stroke="#3d444d" stroke-width="1.6" marker-end="url(#wdm)"/><text x="207" y="30" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" fill="#59636e">ReportAlive()</text><rect x="252" y="92" width="150" height="56" rx="6" fill="#ffffff" stroke="#c9d2c8" stroke-width="1.6"/><text x="327.0" y="116.6" text-anchor="middle" font-family="Public Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328">event flags</text><text x="327.0" y="132.1" text-anchor="middle" font-family="Public Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.0" fill="#59636e">one bit per task, wait all</text><path d="M 402,120 L 448,120" fill="none" stroke="#3d444d" stroke-width="1.6" marker-end="url(#wdm)"/><rect x="450" y="92" width="150" height="56" rx="6" fill="#f5e9dd" stroke="#a5581c" stroke-width="1.6"/><text x="525.0" y="116.6" text-anchor="middle" font-family="Public Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328">watchdog task</text><text x="525.0" y="132.1" text-anchor="middle" font-family="Public Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.0" fill="#59636e">all checked in?</text><path d="M 600,104 L 640,104 L 640,60" fill="none" stroke="#3d444d" stroke-width="1.6" marker-end="url(#wdm)"/><rect x="590" y="14" width="84" height="44" rx="6" fill="#e4f0ec" stroke="#136b5e" stroke-width="1.6"/><text x="632.0" y="32.7" text-anchor="middle" font-family="Public Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328">Refresh</text><text x="632.0" y="47.7" text-anchor="middle" font-family="Public Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#59636e">IWDG</text><text x="632" y="84" text-anchor="end" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" fill="#59636e">yes</text><path d="M 525,148 L 525,190" fill="none" stroke="#3d444d" stroke-width="1.6" marker-end="url(#wdm)"/><text x="535" y="172" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" fill="#59636e">no → no refresh</text><rect x="380" y="192" width="290" height="66" rx="6" fill="#faf1de" stroke="#8a5a12" stroke-width="1.6"/><text x="525.0" y="213.9" text-anchor="middle" font-family="Public Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328">IWDG reset after timeout</text><text x="525.0" y="229.4" text-anchor="middle" font-family="Public Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.0" fill="#59636e">on boot: log reset cause, failed_boots++</text><text x="525.0" y="244.9" text-anchor="middle" font-family="Public Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.0" fill="#59636e">≥ N in a row → log boot loop</text></svg>